name: home_helper_flutter_ui_kit
description: Home Helper On Demand Service Flutter UI Kit
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
# Flutter Version: 3.32.2
# Dart Version: 3.8.1
version: 1.0.3

environment:
  sdk: '>=3.0.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  get:
  flutter_screenutil: ^5.9.0
  shared_preferences: ^2.2.1
  get_storage: ^2.1.1
  flutter_switch:
  pinput: ^5.0.0
  convex_bottom_bar: ^3.2.0
  persistent_bottom_nav_bar: ^5.0.2
  salomon_bottom_bar: ^3.3.2
  sticky_headers: ^0.3.0+2
  google_maps_flutter: ^2.9.0
  another_stepper: ^1.2.2
  stepper_list_view: ^0.0.1
  dotted_line: ^3.2.2
  dotted_border: ^2.1.0
  flutter_rating_bar: ^4.0.1
  flutter_custom_clippers: ^2.1.0
  email_validator: ^2.1.17
  intl: ^0.18.1
  image_picker: ^1.0.4
  cupertino_will_pop_scope: ^1.2.1
  http: ^1.1.0
  geolocator: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - asset/images/
    - asset/icons/
  fonts:
    - family: Mulish-Bold
      fonts:
        - asset: asset/fonts/Mulish-Bold.ttf
    - family: Mulish-Medium
      fonts:
        - asset: asset/fonts/Mulish-Medium.ttf
    - family: Mulish-Regular
      fonts:
        - asset: asset/fonts/Mulish-Regular.ttf
    - family: Mulish-SemiBold
      fonts:
        - asset: asset/fonts/Mulish-SemiBold.ttf
    - family: Mulish-ExtraBold
      fonts:
        - asset: asset/fonts/Mulish-ExtraBold.ttf
    - family: Mulish-ExtraLight
      fonts:
        - asset: asset/fonts/Mulish-ExtraLight.ttf
    - family: Mulish-Light
      fonts:
        - asset: asset/fonts/Mulish-Light.ttf
    - family: Mulish-ExtraLight
      fonts:
        - asset: asset/fonts/Mulish-ExtraLight.ttf



