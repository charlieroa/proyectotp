<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Luxe — App para estilistas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; background:#0a0a0a; color:#fff; font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  button { font-family: inherit; }
  input { font-family: inherit; }
  @keyframes vaBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  @keyframes vbPulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.25); } }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .screen-enter { animation: fadeIn 280ms ease-out; }
  ::-webkit-scrollbar { display: none; }
  .canvas-header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    padding: 14px 24px;
    background: linear-gradient(to bottom, rgba(240,238,233,0.95), rgba(240,238,233,0));
    display: flex; justify-content: space-between; align-items: center;
    pointer-events: none;
  }
  .canvas-header > * { pointer-events: auto; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="android-frame.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="app-data.jsx"></script>
<script type="text/babel" src="app-icons.jsx"></script>
<script type="text/babel" src="appt-modal.jsx"></script>
<script type="text/babel" src="variant-a-core.jsx"></script>
<script type="text/babel" src="variant-a-screens.jsx"></script>
<script type="text/babel" src="variant-b-core.jsx"></script>
<script type="text/babel" src="variant-b-screens.jsx"></script>

<script type="text/babel">
// ─────────────────────────────────────────────────────────────
// Main app — shared state + per-variant screen renderer
// ─────────────────────────────────────────────────────────────
function useLang() {
  const [lang, setLang] = React.useState(() => localStorage.getItem('luxe-lang') || 'es');
  const toggle = () => {
    const next = lang === 'es' ? 'en' : 'es';
    setLang(next);
    localStorage.setItem('luxe-lang', next);
  };
  return { lang, t: I18N[lang], toggleLang: toggle };
}

function useScreen(key, def='home') {
  const [s, setS] = React.useState(() => localStorage.getItem(key) || def);
  const set = (v) => { setS(v); localStorage.setItem(key, v); };
  return [s, set];
}

// Variant A shell
function VariantAApp({ frame = 'ios' }) {
  const { lang, t, toggleLang } = useLang();
  const [screen, setScreen] = useScreen('luxe-va-screen', 'home');

  const content = (() => {
    switch (screen) {
      case 'home':     return <VAHome t={t} lang={lang} go={setScreen}/>;
      case 'schedule': return <VASchedule t={t} lang={lang}/>;
      case 'earnings': return <VAEarnings t={t} lang={lang}/>;
      case 'queue':    return <VAQueue t={t} lang={lang}/>;
      case 'clients':  return <VAClients t={t} lang={lang}/>;
      case 'profile':  return <VAProfile t={t} lang={lang}/>;
      default: return null;
    }
  })();

  const titleMap = { home:'', schedule: t.scheduleTitle, earnings: t.earnings, queue: t.queueTitle, clients: t.clientsTitle, profile: t.profile };
  const showHeader = screen === 'home';

  const inner = (
    <div style={{ background: VA.bg, minHeight:'100%', color: VA.text, position:'relative', overflow:'hidden' }}>
      {showHeader && <VAHeader t={t} lang={lang} onToggleLang={toggleLang}/>}
      {!showHeader && (
        <div style={{ padding:'14px 20px 8px', display:'flex', justifyContent:'space-between', alignItems:'center' }}>
          <div style={{
            fontFamily:'"Instrument Serif", Georgia, serif',
            fontSize: 30, color: VA.text, fontWeight: 400, letterSpacing: -0.6,
          }}>{titleMap[screen]}</div>
          <button onClick={toggleLang} style={{
            background: VA.surface, border:`1px solid ${VA.border}`, borderRadius: 999,
            padding:'6px 12px', color: VA.text, fontSize: 11, fontWeight: 700, letterSpacing: 0.5, cursor:'pointer',
          }}>{lang === 'es' ? 'EN' : 'ES'}</button>
        </div>
      )}
      <div className="screen-enter" key={screen+lang}>{content}</div>
      <VABottomNav current={screen} onNav={setScreen} t={t} safe={frame === 'ios' ? 30 : 14}/>
    </div>
  );

  if (frame === 'ios') {
    return (
      <IOSDevice dark width={390} height={844}>
        <div style={{ paddingTop: 54, height:'100%', background: VA.bg }}>
          {inner}
        </div>
      </IOSDevice>
    );
  }
  return (
    <AndroidDevice dark width={390} height={844}>
      <div style={{ height:'100%', background: VA.bg }}>
        {inner}
      </div>
    </AndroidDevice>
  );
}

// Variant B shell
function VariantBApp({ frame = 'ios' }) {
  const { lang, t, toggleLang } = useLang();
  const [screen, setScreen] = useScreen('luxe-vb-screen', 'home');

  const content = (() => {
    switch (screen) {
      case 'home':     return <VBHome t={t} lang={lang} go={setScreen}/>;
      case 'schedule': return <VBSchedule t={t} lang={lang}/>;
      case 'earnings': return <VBEarnings t={t} lang={lang}/>;
      case 'queue':    return <VBQueue t={t} lang={lang}/>;
      case 'clients':  return <VBClients t={t} lang={lang}/>;
      case 'profile':  return <VBProfile t={t} lang={lang}/>;
      default: return null;
    }
  })();

  const titleMap = {
    home:'', schedule: t.scheduleTitle, earnings: t.earnings, queue: t.queueTitle, clients: t.clientsTitle, profile: t.profile,
  };
  const showHeader = screen === 'home';

  const inner = (
    <div style={{ background: VB.bg, minHeight:'100%', color: VB.text, position:'relative', overflow:'hidden', fontFamily: 'Inter, system-ui, sans-serif' }}>
      {showHeader && <VBHeader t={t} lang={lang} onToggleLang={toggleLang}/>}
      {!showHeader && (
        <div style={{ padding:'12px 12px 4px', display:'flex', justifyContent:'space-between', alignItems:'center' }}>
          <div style={{ display:'flex', alignItems:'center', gap: 10 }}>
            <button onClick={() => setScreen('home')} aria-label="back" style={{
              width: 36, height: 36, borderRadius: 10, background: VB.surface,
              border:`1px solid ${VB.border2}`, display:'flex', alignItems:'center', justifyContent:'center',
              cursor:'pointer', color: VB.text,
            }}>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M15 18 L9 12 L15 6"/></svg>
            </button>
            <div style={{
              fontSize: 22, color: VB.text, fontWeight: 800, letterSpacing: -0.5,
            }}>{titleMap[screen]}<span style={{ color: VB.lime }}>.</span></div>
          </div>
          <button onClick={toggleLang} style={{
            background: VB.surface, border:`1px solid ${VB.border2}`, borderRadius: 10,
            padding:'6px 10px', color: VB.text, fontSize: 11, fontWeight: 700, letterSpacing: 0.5, cursor:'pointer',
          }}>{lang === 'es' ? 'EN' : 'ES'}</button>
        </div>
      )}
      <div className="screen-enter" key={screen+lang}>{content}</div>
      <VBBottomNav current={screen} onNav={setScreen} t={t} safe={frame === 'ios' ? 30 : 14}/>
    </div>
  );

  if (frame === 'ios') {
    return (
      <IOSDevice dark width={390} height={844}>
        <div style={{ paddingTop: 54, height:'100%', background: VB.bg }}>
          {inner}
        </div>
      </IOSDevice>
    );
  }
  return (
    <AndroidDevice dark width={390} height={844}>
      <div style={{ height:'100%', background: VB.bg }}>
        {inner}
      </div>
    </AndroidDevice>
  );
}

function App() {
  return (
    <>
      <DesignCanvas>
        <div className="canvas-header">
          <div style={{ display:'flex', alignItems:'center', gap: 14 }}>
            <div style={{
              fontSize: 28, fontWeight: 700, letterSpacing: -0.6,
              color: 'rgba(20,15,5,0.9)',
              fontFamily:'"Instrument Serif", Georgia, serif',
            }}>Luxe<span style={{ fontStyle:'italic', fontWeight: 400 }}> — stylist app</span></div>
            <div style={{
              fontSize: 11, color:'rgba(60,50,40,0.55)', fontWeight: 600, letterSpacing: 0.5,
              padding:'5px 10px', background:'rgba(0,0,0,0.04)', borderRadius: 999,
            }}>TUPELUKERIA · iOS + ANDROID · 6 SCREENS</div>
          </div>
          <div style={{ fontSize: 11, color:'rgba(60,50,40,0.55)', fontWeight: 500 }}>
            Tap bottom nav to navigate. Toggle ES/EN top-right.
          </div>
        </div>

        <div style={{ height: 60 }}/>

        <DCSection
          title="Luxe · App del estilista"
          subtitle="Tupelukeria IA · carbón + dorado champán · fichero guiado por tiempos · 6 pantallas · iOS + Android"
          gap={60}
        >
          <DCArtboard label="iOS · iPhone 15" width={390} height={844}>
            <VariantBApp frame="ios"/>
          </DCArtboard>
          <DCArtboard label="Android · Material" width={390} height={844}>
            <VariantBApp frame="android"/>
          </DCArtboard>
          <DCPostIt top={40} left={-60} rotate={-3} width={200}>
            Paleta oscuro carbón + dorado champán. Lujo nocturno, alto contraste.
          </DCPostIt>
          <DCPostIt top={520} left={-60} rotate={4} width={200}>
            El fichero pone el tiempo al centro: hora exacta + countdown, no solo un número de posición.
          </DCPostIt>
        </DCSection>
      </DesignCanvas>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
