# ============================================================
# tupelukeria.com / www.tupelukeria.com — Landing Page estatica
# ============================================================
<VirtualHost *:80>
    ServerName tupelukeria.com
    ServerAlias www.tupelukeria.com tupelukeria.co www.tupelukeria.co

    DocumentRoot /home/vps/tupelukeria/landing

    <Directory /home/vps/tupelukeria/landing>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Servir index.html como pagina principal
    DirectoryIndex index.html

    ErrorLog ${APACHE_LOG_DIR}/landing-error.log
    CustomLog ${APACHE_LOG_DIR}/landing-access.log combined
</VirtualHost>

# ============================================================
# app.tupelukeria.com — React App (Login, Registro, Dashboard)
# ============================================================
<VirtualHost *:80>
    ServerName app.tupelukeria.com

    # Frontend - React SPA build
    DocumentRoot /home/vps/tupelukeria/frontend/build

    <Directory /home/vps/tupelukeria/frontend/build>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # SPA fallback: cualquier ruta que no sea archivo fisico -> index.html
    RewriteEngine On
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} -f [OR]
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} -d
    RewriteRule ^ - [L]
    RewriteRule ^ /index.html [L]

    # Backend API proxy
    ProxyPreserveHost On
    ProxyPass /api http://127.0.0.1:5000/api
    ProxyPassReverse /api http://127.0.0.1:5000/api

    # WebSocket proxy
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule /socket.io/(.*) ws://127.0.0.1:5000/socket.io/$1 [P,L]
    ProxyPass /socket.io http://127.0.0.1:5000/socket.io
    ProxyPassReverse /socket.io http://127.0.0.1:5000/socket.io

    # Uploads proxy
    ProxyPass /uploads http://127.0.0.1:5000/uploads
    ProxyPassReverse /uploads http://127.0.0.1:5000/uploads

    ErrorLog ${APACHE_LOG_DIR}/app-tupelukeria-error.log
    CustomLog ${APACHE_LOG_DIR}/app-tupelukeria-access.log combined
</VirtualHost>
