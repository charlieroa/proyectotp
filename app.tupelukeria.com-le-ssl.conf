<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName app.tupelukeria.com

    DocumentRoot /home/vps/tupelukeria/frontend/build

    <Directory /home/vps/tupelukeria/frontend/build>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # No cache for index.html (SPA entry point)
    <Files "index.html">
        Header set Cache-Control "no-cache, no-store, must-revalidate"
        Header set Pragma "no-cache"
        Header set Expires 0
    </Files>

    # Backend API proxy
    ProxyPreserveHost On
    ProxyPass /api http://127.0.0.1:5000/api
    ProxyPassReverse /api http://127.0.0.1:5000/api

    # Uploads proxy
    ProxyPass /uploads http://127.0.0.1:5000/uploads
    ProxyPassReverse /uploads http://127.0.0.1:5000/uploads

    # Socket.IO proxy
    ProxyPass /socket.io http://127.0.0.1:5000/socket.io
    ProxyPassReverse /socket.io http://127.0.0.1:5000/socket.io

    # Rewrite rules
    RewriteEngine On

    # WebSocket upgrade for Socket.IO
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /socket\.io/(.*) ws://127.0.0.1:5000/socket.io/$1 [P,L]

    # SPA fallback - EXCLUDE api, socket.io, uploads
    RewriteCond %{REQUEST_URI} !^/api
    RewriteCond %{REQUEST_URI} !^/socket\.io
    RewriteCond %{REQUEST_URI} !^/uploads
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-f
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-d
    RewriteRule ^ /index.html [L]

    ErrorLog ${APACHE_LOG_DIR}/app-tupelukeria-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/app-tupelukeria-ssl-access.log combined

    SSLCertificateFile /etc/letsencrypt/live/app.tupelukeria.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/app.tupelukeria.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
